{% extends 'base.html' %}

{% block title %}Change password | EZ360PM{% endblock %}

{% block content %}
<div class="page-heading"><div><p class="eyebrow">Settings</p><h1>Change password</h1></div></div>
<form method="post" class="content-card structured-form" novalidate>
    {% csrf_token %}
    {{ form.as_p }}
    <div class="form-actions"><button class="btn btn-primary" type="submit">Change password</button><a class="btn btn-light" href="{% url 'accounts:settings' %}">Cancel</a></div>
</form>
{% endblock %}
