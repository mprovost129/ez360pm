name: Quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: ez360pm
          POSTGRES_USER: ez360pm
          POSTGRES_PASSWORD: ez360pm
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ez360pm"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # Disposable CI-only values. Production secrets stay in Render and must
      # never be copied into this workflow.
      SECRET_KEY: ci-only-long-random-looking-secret-key-1234567890-abcdefghij
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_NAME: ez360pm
      DB_USER: ez360pm
      DB_PASSWORD: ez360pm
      ALLOWED_HOSTS: app.example.test,localhost
      CSRF_TRUSTED_ORIGINS: https://app.example.test
      PUBLIC_BASE_URL: https://app.example.test
      REDIS_URL: redis://127.0.0.1:6379/1
      EMAIL_PROVIDER: django
      EMAIL_BACKEND: django.core.mail.backends.locmem.EmailBackend
      DEFAULT_FROM_EMAIL: EZ360PM CI <noreply@example.test>
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt
      - run: pip check
      - run: sh -n bin/start.sh
      - run: ruff check accounts assistant clients config core documents intake projects
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py migrate --noinput
      - run: python manage.py test -v 1
      - run: python manage.py deployment_check
        env:
          DJANGO_SETTINGS_MODULE: config.Settings.prod
      - run: python manage.py data_audit --fail-on-warning
        env:
          DJANGO_SETTINGS_MODULE: config.Settings.prod
      - run: python manage.py check --deploy --fail-level WARNING
        env:
          DJANGO_SETTINGS_MODULE: config.Settings.prod
      - run: docker build --tag ez360pm:ci .

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: ez360pm
          POSTGRES_USER: ez360pm
          POSTGRES_PASSWORD: ez360pm
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ez360pm"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      SECRET_KEY: ci-browser-only-secret-key-1234567890-abcdefghij
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_NAME: ez360pm
      DB_USER: ez360pm
      DB_PASSWORD: ez360pm
      ALLOWED_HOSTS: localhost,127.0.0.1
      CSRF_TRUSTED_ORIGINS: http://localhost
      PUBLIC_BASE_URL: http://localhost
      EMAIL_PROVIDER: django
      EMAIL_BACKEND: django.core.mail.backends.locmem.EmailBackend
      DEFAULT_FROM_EMAIL: EZ360PM Browser CI <noreply@example.test>
      PLAYWRIGHT_HEADLESS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-browser.txt
      - run: pip install -r requirements-browser.txt
      - run: python -m playwright install --with-deps chromium
      - run: python manage.py migrate --noinput
      - run: python manage.py test browser_tests.critical_workflows -v 1
      - name: Upload browser traces after a failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
